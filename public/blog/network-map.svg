<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'IBM Plex Mono', Consolas, monospace">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(122,46,46,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="460" fill="#f7f5f0"/>
  <rect width="800" height="460" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="799" height="459" fill="none" stroke="#e3ded1"/>

  <!-- Internet -->
  <ellipse cx="400" cy="52" rx="72" ry="26" fill="none" stroke="#7a2e2e" stroke-opacity="0.5" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="400" y="57" text-anchor="middle" font-size="12" fill="#544e42">INTERNET</text>

  <!-- Routeur / firewall -->
  <line x1="400" y1="78" x2="400" y2="110" stroke="#7a2e2e" stroke-opacity="0.45" stroke-width="1.25"/>
  <rect x="330" y="110" width="140" height="46" rx="8" fill="#ffffff" stroke="#7a2e2e" stroke-width="1.25"/>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#1a1815">ROUTEUR</text>
  <text x="400" y="146" text-anchor="middle" font-size="10" fill="#8a8375">firewall · passerelle</text>

  <!-- VPN incoming -->
  <path d="M120 60 C160 80 240 100 330 128" fill="none" stroke="#7a2e2e" stroke-opacity="0.35" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="96" y="52" font-size="10" fill="#7a2e2e">ACCÈS DISTANT</text>
  <text x="96" y="66" font-size="10" fill="#8a8375">tunnel VPN</text>

  <!-- Switch -->
  <line x1="400" y1="156" x2="400" y2="196" stroke="#7a2e2e" stroke-opacity="0.45" stroke-width="1.25"/>
  <rect x="320" y="196" width="160" height="40" rx="8" fill="#ffffff" stroke="#e3ded1" stroke-width="1.25"/>
  <text x="400" y="220" text-anchor="middle" font-size="12" fill="#1a1815">SWITCH · LAN</text>

  <!-- branches -->
  <path d="M400 236 V262 H130 V292" fill="none" stroke="#7a2e2e" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M400 236 V262 H310 V292" fill="none" stroke="#7a2e2e" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M400 236 V262 H490 V292" fill="none" stroke="#7a2e2e" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M400 236 V262 H670 V292" fill="none" stroke="#7a2e2e" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Serveurs -->
  <rect x="60" y="292" width="140" height="88" rx="10" fill="#ffffff" stroke="#7a2e2e" stroke-opacity="0.6" stroke-width="1.25"/>
  <circle cx="80" cy="312" r="4" fill="none" stroke="#7a2e2e" stroke-width="1.5"/>
  <text x="94" y="316" font-size="11" fill="#7a2e2e">SRV-DNS</text>
  <text x="76" y="338" font-size="10" fill="#544e42">zones internes</text>
  <text x="76" y="354" font-size="10" fill="#544e42">résolution · cache</text>
  <text x="76" y="370" font-size="10" fill="#8a8375">TTL surveillés</text>

  <rect x="240" y="292" width="140" height="88" rx="10" fill="#ffffff" stroke="#7a2e2e" stroke-opacity="0.6" stroke-width="1.25"/>
  <circle cx="260" cy="312" r="4" fill="none" stroke="#7a2e2e" stroke-width="1.5"/>
  <text x="274" y="316" font-size="11" fill="#7a2e2e">SRV-DHCP</text>
  <text x="256" y="338" font-size="10" fill="#544e42">plages d'adresses</text>
  <text x="256" y="354" font-size="10" fill="#544e42">baux · réservations</text>
  <text x="256" y="370" font-size="10" fill="#8a8375">journalisés</text>

  <rect x="420" y="292" width="140" height="88" rx="10" fill="#ffffff" stroke="#7a2e2e" stroke-opacity="0.6" stroke-width="1.25"/>
  <circle cx="440" cy="312" r="4" fill="none" stroke="#7a2e2e" stroke-width="1.5"/>
  <text x="454" y="316" font-size="11" fill="#7a2e2e">SRV-VPN</text>
  <text x="436" y="338" font-size="10" fill="#544e42">accès distants</text>
  <text x="436" y="354" font-size="10" fill="#544e42">comptes · clés</text>
  <text x="436" y="370" font-size="10" fill="#8a8375">chiffré</text>

  <rect x="600" y="292" width="140" height="88" rx="10" fill="#ffffff" stroke="#a5514c" stroke-width="1.5"/>
  <circle cx="620" cy="312" r="4" fill="#a5514c"/>
  <text x="634" y="316" font-size="11" fill="#7a2e2e">SUPERVISION</text>
  <text x="616" y="338" font-size="10" fill="#544e42">disponibilité</text>
  <text x="616" y="354" font-size="10" fill="#544e42">disque · certifs</text>
  <text x="616" y="370" font-size="10" fill="#8a8375">alertes</text>

  <!-- supervision probes -->
  <path d="M600 336 C560 336 545 336 520 336" fill="none" stroke="#a5514c" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 4"/>
  <path d="M612 292 C570 260 470 252 400 236" fill="none" stroke="#a5514c" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Postes -->
  <path d="M130 380 V404 H400 V418" fill="none" stroke="#7a2e2e" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="330" y="418" width="140" height="30" rx="6" fill="none" stroke="#e3ded1"/>
  <text x="400" y="437" text-anchor="middle" font-size="10" fill="#8a8375">POSTES CLIENTS · DHCP</text>

  <text x="16" y="446" font-size="10" letter-spacing="1" fill="#a89f8c">FIG. 01 - CARTOGRAPHIE RÉSEAU (SCHÉMA DE PRINCIPE)</text>
</svg>
